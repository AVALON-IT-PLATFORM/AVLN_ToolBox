name: Build

on:
  push:
    branches:
      - feature/avln-toolbox-mvp
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore .\AVLN_ToolBox.sln

      - name: Build
        run: dotnet build .\AVLN_ToolBox.sln -c Release -p:Platform=x64 --no-restore
